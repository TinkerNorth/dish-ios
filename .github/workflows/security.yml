name: Security

# Security gates on every pull request, every push to main and weekly. The jobs live in the
# shared _security.yml (action-pin lint, allowlist expiry, OSV-Scanner, dependency review,
# gitleaks); CodeQL lives in codeql.yml because it has its own matrix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    # Exactly what _security.yml declares; a narrower grant fails the call at startup.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: .
      # Package.swift has no dependencies, so there is no Package.resolved and no other
      # manifest OSV-Scanner reads: its "no packages found" is the true answer here. The
      # first package this app takes in lands a Package.resolved, and this line goes.
      osv_allow_no_packages: true
      # The repository's Dependency graph and Dependabot alerts are on, so
      # dependency review runs on every pull request.
      dependency_review_enabled: true
