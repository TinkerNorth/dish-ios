name: Release

# Tagged releases of dish-ios. A bare MAJOR.MINOR.PATCH tag (or a manual run
# naming an existing tag) runs the shared security gates, archives the app,
# hardens the artifacts (Grype scan, SPDX and CycloneDX SBOMs, cosign keyless
# signatures, SHA256SUMS), attaches SLSA provenance and publishes a GitHub
# release.
#
# There is no latest.json manifest and no measurements job: iOS has no in-app
# updater (the App Store and TestFlight deliver updates), and there is no
# bench to run yet.

on:
  push:
    # Bare MAJOR.MINOR.PATCH, no `v`: the fleet's tag shape since 2.0.0.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Required secrets (optional: without them the workflow ships an unsigned IPA;
# a stable tag is blocked by `required-secrets` only when the repository
# variable ENFORCE_RELEASE_SIGNING is "true"):
#
#   APP_STORE_CONNECT_KEY_ID            App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID         the issuer id of that key
#   APP_STORE_CONNECT_PRIVATE_KEY       contents of the key's .p8 file
#   IOS_DISTRIBUTION_CERT_BASE64        base64 of the Apple Distribution .p12
#   IOS_DISTRIBUTION_CERT_PASSWORD      .p12 password
#   IOS_PROVISIONING_PROFILE_BASE64     base64 of the App Store provisioning profile
#
# When all are present the archive is signed, exported and uploaded straight
# to App Store Connect, where it appears in TestFlight. Otherwise the archive
# is built without signing and its Dish.app is zipped into an IPA tagged
# `-unsigned` in its filename; it installs only after re-signing.

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: PR-time gates against tag
    # The shared workflow asks for these; a caller job that grants less is
    # refused before the run starts (dish-mac's 1.0.0 tag's first run did).
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: |
        .
      gitleaks_enabled: true
      dependency_review_enabled: false
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  # ─────────────────────────────────────────────────────────────────────
  # Signing-secret gate. Advisory by default, as the satellite's and the
  # other clients' are: with the six App Store secrets the build is signed and
  # sent to App Store Connect; without them a stable tag still ships, as an
  # UNSIGNED IPA, with a warning. Set the repository variable
  # ENFORCE_RELEASE_SIGNING=true to make missing secrets fail a stable tag.
  # The stable asset name dish-ios.ipa never changes either way.
  # ─────────────────────────────────────────────────────────────────────
  required-secrets:
    name: Required release secrets gate
    needs: [gates]
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    steps:
      - name: Verify required signing secrets are present for tagged releases
        id: check
        env:
          ENFORCE: ${{ vars.ENFORCE_RELEASE_SIGNING }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID \
                      APP_STORE_CONNECT_PRIVATE_KEY IOS_DISTRIBUTION_CERT_BASE64 \
                      IOS_DISTRIBUTION_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store secrets present; the build will be signed and uploaded to App Store Connect."
            exit 0
          fi
          echo "signed=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::notice::Non-tag release run; unsigned fallback permitted. Missing: ${missing[*]}"
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "::warning::Prerelease tag ${GITHUB_REF_NAME}: the IPA will be unsigned. Missing: ${missing[*]}"
              exit 0
              ;;
          esac
          if [ "${ENFORCE:-}" = "true" ]; then
            echo "::error::Stable tagged release on $GITHUB_REF requires App Store signing secrets, but the following are missing: ${missing[*]}"
            echo "::error::Add the missing repository secrets, or unset the ENFORCE_RELEASE_SIGNING repository variable to allow an unsigned release."
            exit 1
          fi
          echo "::warning::Stable tag ${GITHUB_REF_NAME} ships UNSIGNED: no App Store Connect signing yet. Missing: ${missing[*]}"
          echo "::warning::The IPA installs only after re-signing; the release notes say so. Set ENFORCE_RELEASE_SIGNING=true to forbid this."

  release:
    name: Archive Dish.app
    needs: [gates, required-secrets]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIGNED: ${{ needs.required-secrets.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # VERSION is the one source of the app's version; a tag that disagrees
      # would publish an app that reports a different number than its release.
      - name: Assert the tag matches VERSION
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$tag' does not match VERSION '$version'"
            exit 1
          fi
          echo "tag $tag matches VERSION"

      # The build number is the run number: App Store Connect wants it to rise
      # with every upload of one marketing version.
      - name: Archive unsigned
        if: env.SIGNED != 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Dish.xcodeproj \
            -scheme DishApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Dish.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO

      - name: Import signing certificate and profile
        id: sign
        if: env.SIGNED == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          CERT_PW: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          echo "${CERT_B64}" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${CERT_PW}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN}" "$(security list-keychains -d user | tr -d '"')"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          rm -f "${RUNNER_TEMP}/cert.p12"

          # The profile names its own team and display name; read them from it
          # rather than asking for two more secrets.
          echo "${PROFILE_B64}" | base64 -d > "${RUNNER_TEMP}/profile.mobileprovision"
          security cms -D -i "${RUNNER_TEMP}/profile.mobileprovision" > "${RUNNER_TEMP}/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${RUNNER_TEMP}/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "${RUNNER_TEMP}/profile.plist")
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${RUNNER_TEMP}/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "${RUNNER_TEMP}/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
          echo "::add-mask::${team}"
          echo "profile_name=${name}" >> "$GITHUB_OUTPUT"
          echo "team=${team}" >> "$GITHUB_OUTPUT"
          echo "keychain=${KEYCHAIN}" >> "$GITHUB_OUTPUT"

      - name: Archive signed
        if: env.SIGNED == 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Dish.xcodeproj \
            -scheme DishApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Dish.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ steps.sign.outputs.team }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.sign.outputs.profile_name }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.sign.outputs.keychain }}"

      # `destination: upload` sends the build to App Store Connect from the
      # export step itself, so no IPA is left on the runner; the dSYMs are
      # kept as the release's own asset.
      - name: Export and upload to App Store Connect
        if: env.SIGNED == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "${PRIVATE_KEY}" > "${key_path}"
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>destination</key><string>upload</string>
              <key>uploadSymbols</key><true/>
              <key>signingStyle</key><string>manual</string>
              <key>teamID</key><string>${{ steps.sign.outputs.team }}</string>
              <key>signingCertificate</key><string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.tinkernorth.dish.ios</key><string>${{ steps.sign.outputs.profile_name }}</string>
              </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Dish.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath "${RUNNER_TEMP}/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${key_path}" \
            -authenticationKeyID "${KEY_ID}" \
            -authenticationKeyIssuerID "${ISSUER_ID}"
          rm -f "${key_path}"

      - name: Remove the temporary keychain
        if: always() && env.SIGNED == 'true'
        run: |
          security delete-keychain "${{ steps.sign.outputs.keychain }}" || true
          rm -f "${RUNNER_TEMP}/profile.mobileprovision" "${RUNNER_TEMP}/profile.plist"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          tag="${{ inputs.tag || github.ref_name }}"
          archive="$RUNNER_TEMP/Dish.xcarchive"
          if [ "${SIGNED}" = "true" ]; then
            ditto -c -k --keepParent "${archive}/dSYMs" "dist/dish-${tag}-dSYMs.zip"
          else
            # An IPA is a zip whose Payload/ holds the .app. The versioned copy
            # carries the honesty marker; dish-ios.ipa is the stable name and
            # never changes shape, signed or not.
            payload="$RUNNER_TEMP/ipa"
            mkdir -p "${payload}/Payload"
            cp -R "${archive}/Products/Applications/Dish.app" "${payload}/Payload/"
            (cd "${payload}" && zip -qry "$GITHUB_WORKSPACE/dist/dish-${tag}-unsigned.ipa" Payload)
            cp "dist/dish-${tag}-unsigned.ipa" dist/dish-ios.ipa
          fi
          ls -l dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: dist/
          if-no-files-found: error

  harden:
    name: Harden artifacts (scan, SBOM, sign)
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      security-events: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      # The IPAs (or the dSYMs of a build that went to App Store Connect) land
      # in one directory so SHA256SUMS, the cosign signatures and the SLSA
      # provenance cover every file that ships.
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ios*
          merge-multiple: true
          path: release

      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          path: release/
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          add-cpes-if-none: true
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        if: ${{ always() && steps.grype.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: release-grype

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: release/
          format: spdx-json
          output-file: release/dish-ios.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: release/
          format: cyclonedx-json
          output-file: release/dish-ios.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign (upstream binary)
        shell: bash
        env:
          COSIGN_VERSION: "2.4.1"
          # Pin upstream SHA-256 of cosign-linux-amd64. Verify with:
          #   gh release view v${COSIGN_VERSION} -R sigstore/cosign --json assets
          COSIGN_SHA256: "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b" # cosign-linux-amd64 v2.4.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          if [ "${COSIGN_SHA256}" != "TODO_REPLACE_WITH_UPSTREAM_SHA256" ]; then
            echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          else
            echo "::warning::COSIGN_SHA256 is unset — replace with the upstream SHA-256 to enforce binary integrity."
          fi
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -d '\n' sha256sum --binary > SHA256SUMS
          cat SHA256SUMS

      - name: Cosign-sign each artifact + SHA256SUMS (keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd release
          for f in *; do
            case "$f" in
              *.sig|*.crt|SHA256SUMS.sig|SHA256SUMS.crt) continue ;;
            esac
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.crt" \
              "$f"
          done
          ls -l

      - name: Compute base64 SHA256 hashes for SLSA provenance
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          cd release
          h=$(find . -maxdepth 1 -type f ! -name '*.sig' ! -name '*.crt' \
                  -printf '%f\n' \
                | LC_ALL=C sort \
                | xargs -d '\n' sha256sum \
                | base64 -w0)
          echo "hashes=${h}" >> "$GITHUB_OUTPUT"

      - name: Upload hardened bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release/
          retention-days: 14

  provenance:
    name: SLSA L3 provenance
    needs: [harden]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.harden.outputs.hashes }}
      provenance-name: dish-ios.intoto.jsonl
      upload-assets: false
      # The generator is pinned by commit, as every action here is; a commit pin
      # only works when the generator is built from that source. A download
      # wants a vX.Y.Z tag and refuses the ref, as 1.0.1's release did.
      compile-generator: true

  publish:
    name: Publish to GitHub Releases
    needs: [required-secrets, harden, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download hardened bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Download SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release

      - name: Show what we're about to publish
        run: find release -type f -printf '%p\n'

      # An unsigned build says so at the top of its notes, above the generated
      # list, so nobody learns it from a failed install first.
      - name: Write the signing note
        shell: bash
        env:
          SIGNED: ${{ needs.required-secrets.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "${SIGNED}" = "true" ]; then
            printf '%s\n' "Signed and uploaded to App Store Connect: this build is in TestFlight, and ships through the App Store once released there. The assets here are the debug symbols and the supply-chain files." > note.md
          else
            printf '%s\n' "The IPA in this release is unsigned. It does not install as downloaded: re-sign it with your own certificate and provisioning profile (for example with a sideloading tool) first. Verify the download against SHA256SUMS. Releases go to TestFlight and the App Store once App Store Connect signing is configured." > note.md
          fi
          cat note.md

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: note.md
          generate_release_notes: true
          files: release/**/*
