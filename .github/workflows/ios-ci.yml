name: iOS CI

# The merge gate for dish-ios: format, lint, project drift, the app build with
# every package test target on an iPhone, the UI tests again on an iPad, and a
# Release build of the app. scripts/ci-local.sh runs the same gates in the
# same order.
#
# No build cache. The package has no dependencies, so there is nothing to
# resolve or download, and a restored DerivedData carries the previous
# commit's objects and compiled resource bundles, which is how a stale
# catalog shadows the current one. A cold build is the honest one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Format, lint, project, test, release build
    # Xcode 26 is the default on this image and the iOS 26 SDK is the
    # deployment floor; bump together with CONTRIBUTING.md.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create and boot the iPhone the tests run on
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes -j | python3 -I -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          runtimes.sort(key=lambda r: tuple(int(part) for part in r["version"].split(".")))
          print(runtimes[-1]["identifier"] if runtimes else "")
          ')"
          udid="$(xcrun simctl create "CI iPhone" "iPhone 17 Pro" "$runtime")"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Swift version
        run: swift --version

      # Release binaries at pinned versions, not `brew install`: Homebrew
      # tracks its latest, and a new formatter rule turns the check red
      # without a Swift file changing. These are the versions the tree is
      # formatted, linted and generated with; a bump is a deliberate commit
      # that reformats or regenerates alongside it, in scripts/tools.sh too.
      - name: Install SwiftFormat, SwiftLint and XcodeGen (pinned)
        env:
          SWIFTFORMAT_VERSION: 0.61.1
          SWIFTFORMAT_SHA256: b990400779aceb7d7020796eb9ba814d4480543f671d38fc0ff48cb72f04c584
          SWIFTLINT_VERSION: 0.65.0
          SWIFTLINT_SHA256: d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $tools/swiftformat.zip" | shasum -a 256 -c -
          unzip -q -o "$tools/swiftformat.zip" -d "$tools"
          curl -fsSL --retry 3 -o "$tools/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $tools/swiftlint.zip" | shasum -a 256 -c -
          unzip -q -o "$tools/swiftlint.zip" -d "$tools"
          curl -fsSL --retry 3 -o "$tools/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $tools/xcodegen.zip" | shasum -a 256 -c -
          unzip -q -o "$tools/xcodegen.zip" -d "$tools"
          chmod +x "$tools/swiftformat" "$tools/swiftlint" "$tools/xcodegen/bin/xcodegen"
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/swiftformat" --version
          "$tools/swiftlint" --version
          "$tools/xcodegen/bin/xcodegen" --version

      - name: SwiftFormat (check only)
        run: |
          set -uo pipefail
          # A rule that times out on a loaded runner is not a finding, so the
          # lint runs once more then; any other failure stands.
          if ! output="$(swiftformat --lint . 2>&1)"; then
            echo "$output"
            grep -q "rule timed out" <<<"$output" || exit 1
            echo "A rule timed out on a slow runner; linting once more."
            swiftformat --lint .
          fi

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      # generate-project.sh fetches its own pinned XcodeGen into .build/tools;
      # the copy above only proves the digest on this runner.
      - name: Dish.xcodeproj matches project.yml
        run: scripts/generate-project.sh --check

      # Builds the app and runs every package test target the scheme lists.
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Dish.xcodeproj \
            -scheme DishApp \
            -destination "$SIM_DESTINATION" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      # The UI tests again on an iPad, where the tabs open into a sidebar,
      # Controllers and Connections split, and the windows turn with the
      # device. The package's suites do not depend on the device, so only the
      # UI bundle runs, over the build above (same flags, no rebuild).
      #
      # scripts/ci-simulator.sh creates the iPad, reads it back from
      # `simctl list` as Booted after `bootstatus` and again right before
      # xcodebuild (recreating it when it is not), and runs xcodebuild once
      # more only when the runner, not a test, failed. Run 43076579363:
      # attempt 2's `bootstatus -b` returned after 3:22 with no boot stage
      # printed and a minute later xcodebuild listed no simulator at all;
      # attempt 3 found the iPad and the UI test runner timed out loading
      # Accessibility before any test ran.
      - name: Create and boot the iPad the UI tests run on
        run: |
          set -euo pipefail
          udid="$(scripts/ci-simulator.sh create "CI iPad" "iPad Pro 11-inch")"
          echo "IPAD_UDID=$udid" >> "$GITHUB_ENV"

      - name: UI tests on iPad
        run: |
          set -euo pipefail
          scripts/ci-simulator.sh run "$IPAD_UDID" "CI iPad" "iPad Pro 11-inch" \
            xcodebuild test \
              -project Dish.xcodeproj \
              -scheme DishApp \
              -only-testing:DishUITests \
              -enableCodeCoverage YES \
              CODE_SIGNING_ALLOWED=NO

      - name: Build release
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Dish.xcodeproj \
            -scheme DishApp \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator .app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dish.app
          path: build/Build/Products/Release-iphonesimulator/Dish.app
          if-no-files-found: error
          retention-days: 14

  # The LOCK_STATS build counts every tracked lock by thread role; the
  # lock-law test and the tracked-lock tests run only there. A cold build of
  # its own, as the merge gate's is.
  lock-stats:
    name: Lock statistics build and tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create and boot the iPhone the tests run on
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes -j | python3 -I -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          runtimes.sort(key=lambda r: tuple(int(part) for part in r["version"].split(".")))
          print(runtimes[-1]["identifier"] if runtimes else "")
          ')"
          udid="$(xcrun simctl create "CI iPhone" "iPhone 17 Pro" "$runtime")"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Run the lock statistics tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Dish.xcodeproj \
            -scheme DishApp \
            -destination "$SIM_DESTINATION" \
            -only-testing:DishEngineTests/LockLawTests \
            -only-testing:DishEngineTests/TrackedLockTests \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCK_STATS'
