name: iOS CI

# The merge gate for dish-ios: format, lint, project drift, the app build with
# every package test target on an iPhone, the UI tests again on an iPad, a
# Release build of the app and an unsigned archive of it for a generic iOS
# device. Every step calls a script under scripts/, and scripts/ci-local.sh
# calls the same scripts in the same order; the header of ci-local.sh lists
# the few things only CI runs.
#
# No build cache. The package has no dependencies, so there is nothing to
# resolve or download, and a restored DerivedData carries the previous
# commit's objects and compiled resource bundles, which is how a stale
# catalog shadows the current one. A cold build is the honest one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, lint, format
    # Xcode is selected by the version pinned in scripts/tools.sh, so an image
    # update cannot change the toolchain; the iOS 26 SDK is the deployment
    # floor. Bump together with CONTRIBUTING.md.
    runs-on: macos-26
    # The steps add up to 47 to 51 minutes on a quick runner and past an hour on
    # a slow one: the release build alone has taken 4 minutes and 13.
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: scripts/select-xcode.sh

      - name: Swift version
        run: swift --version

      # Release binaries at pinned versions, not `brew install`: Homebrew
      # tracks its latest, and a new formatter rule turns the check red
      # without a Swift file changing. scripts/tools.sh holds the pins; a bump
      # is a deliberate commit that reformats or regenerates alongside it.
      - name: SwiftFormat (check only)
        run: scripts/check-format.sh

      - name: SwiftLint
        run: scripts/check-lint.sh

      - name: Dish.xcodeproj matches project.yml
        run: scripts/generate-project.sh --check

      # Builds the app and runs every package test target the scheme lists.
      - name: Build and test on an iPhone
        run: scripts/test.sh iphone

      # The UI tests again on an iPad, where the tabs open into a sidebar,
      # Controllers and Connections split, and the windows turn with the
      # device. The package's suites do not depend on the device, so only the
      # UI bundle runs.
      #
      # test.sh creates the iPad through scripts/ci-simulator.sh, which reads
      # it back from `simctl list` as Booted after `bootstatus` and again right
      # before xcodebuild (recreating it when it is not), and runs xcodebuild
      # once more only when the runner, not a test, failed. Run 43076579363:
      # attempt 2's `bootstatus -b` returned after 3:22 with no boot stage
      # printed and a minute later xcodebuild listed no simulator at all;
      # attempt 3 found the iPad and the UI test runner timed out loading
      # Accessibility before any test ran.
      - name: UI tests on an iPad
        run: scripts/test.sh ipad

      - name: Build release
        run: scripts/build-release.sh

      - name: Upload simulator .app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dish.app
          path: build/Build/Products/Release-iphonesimulator/Dish.app
          if-no-files-found: error
          retention-days: 14

      # release.yml archives for a generic iOS device and signs only at the
      # tag; this is the same archive without signing, so a compile or link
      # error only a device build raises shows here, and the unsigned IPA is
      # packaged the way the release packages it. The signed archive, the
      # export and the App Store Connect upload need the signing secrets and
      # are not exercised before a tag.
      - name: Archive for a generic iOS device (unsigned)
        run: scripts/archive-device.sh "$RUNNER_TEMP/Dish.xcarchive" CODE_SIGNING_ALLOWED=NO

      # The release's own assets, named the way a tag names them (unsigned), for
      # the hardening dry run below.
      - name: Stage the unsigned IPA
        run: scripts/stage-ipa.sh "$RUNNER_TEMP/Dish.xcarchive" "$(tr -d '[:space:]' < VERSION)"

      - name: Upload the IPA for the hardening dry run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # The release's scan, SBOMs, checksums and signing, on the PR-built IPA: the
  # shared workflow release.yml calls on a tag, with a throwaway key and nothing
  # published. contents: read is all it needs, so it runs on a fork's pull
  # request too.
  release-dry-run:
    name: Release hardening (dry run)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [ci]
    permissions:
      contents: read
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: ios*
      product: dish-ios
      dry-run: true

  # The LOCK_STATS build counts every tracked lock by thread role; the
  # lock-law test and the tracked-lock tests run only there. A cold build of
  # its own, as the merge gate's is. ci-local.sh --with-lock-stats runs it.
  lock-stats:
    name: Lock statistics build and tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: scripts/select-xcode.sh

      - name: Run the lock statistics tests
        run: scripts/test.sh lock-stats
